<svg xmlns="http://www.w3.org/2000/svg" width="96" height="128" viewBox="0 0 96 128">
  <!-- One frame of a vertical 35mm film strip. Repeats down the page. -->
  <rect width="96" height="128" fill="#1a1714"/>
  <!-- Sprocket holes on both edges, cut out in the page background colour. -->
  <g fill="#0e0d0c">
    <rect x="6" y="6" width="9" height="12" rx="2"/>
    <rect x="6" y="38" width="9" height="12" rx="2"/>
    <rect x="6" y="70" width="9" height="12" rx="2"/>
    <rect x="6" y="102" width="9" height="12" rx="2"/>
    <rect x="81" y="6" width="9" height="12" rx="2"/>
    <rect x="81" y="38" width="9" height="12" rx="2"/>
    <rect x="81" y="70" width="9" height="12" rx="2"/>
    <rect x="81" y="102" width="9" height="12" rx="2"/>
  </g>
  <!-- The picture frame, with a faint warm glow like a lit exposure. -->
  <rect x="22" y="8" width="52" height="112" rx="3" fill="#13110f" stroke="#2b2620" stroke-width="1.5"/>
  <rect x="30" y="20" width="36" height="22" rx="2" fill="#1d1915"/>
  <circle cx="48" cy="82" r="14" fill="none" stroke="#231f1a" stroke-width="2"/>
</svg>
