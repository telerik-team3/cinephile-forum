<svg xmlns="http://www.w3.org/2000/svg" width="300" height="440" viewBox="0 0 300 440">
  <!-- A generic old-style film poster outline: border, spotlight star,
       title banners and a credits block. Not based on any real poster. -->
  <rect x="6" y="6" width="288" height="428" fill="#f3ece0" stroke="#d3c3a8" stroke-width="3"/>
  <rect x="18" y="18" width="264" height="404" fill="none" stroke="#ddd0ba" stroke-width="1.5"/>
  <g fill="#ddcfb7">
    <polygon points="150,58 162,94 200,94 169,116 181,152 150,130 119,152 131,116 100,94 138,94"/>
  </g>
  <g stroke="#e4d9c6" stroke-width="2">
    <line x1="150" y1="104" x2="40" y2="250"/>
    <line x1="150" y1="104" x2="80" y2="260"/>
    <line x1="150" y1="104" x2="220" y2="260"/>
    <line x1="150" y1="104" x2="260" y2="250"/>
  </g>
  <rect x="40" y="276" width="220" height="30" rx="2" fill="#d6c6aa"/>
  <rect x="70" y="316" width="160" height="10" rx="2" fill="#ddcfb7"/>
  <g fill="#e2d7c4">
    <rect x="50" y="356" width="200" height="4"/>
    <rect x="62" y="366" width="176" height="4"/>
    <rect x="80" y="376" width="140" height="4"/>
  </g>
  <rect x="110" y="396" width="80" height="8" rx="2" fill="#ddcfb7"/>
</svg>
